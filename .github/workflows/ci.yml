name: MFA Foundation CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify tracking-only financial safety guards
        run: |
          grep -q "check (simulation_only = true)" supabase/migrations/20261101130000_mfa_agent_trust_capital_commission_tables.sql
          grep -q "check (funds_held = false)" supabase/migrations/20261101130000_mfa_agent_trust_capital_commission_tables.sql
          grep -q "check (release_executed = false)" supabase/migrations/20261101130000_mfa_agent_trust_capital_commission_tables.sql
          grep -q "check (payable = false)" supabase/migrations/20261101130000_mfa_agent_trust_capital_commission_tables.sql
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
